services:
  bot:
    build: .
    container_name: astrion-music-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_HOST: 0.0.0.0
    ports:
      - "${HEALTH_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - astrion-recordings:/usr/src/app/data/recordings

volumes:
  astrion-recordings:
